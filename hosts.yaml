---
control:
  hosts:
    local-control:
      ansible_connection: local
    control-vm:
      ansible_host: control

appservers:
    hosts:
      appserver-vm:
        ansible_host: appserver
      backend-vm: #VM για την εγκατάσταση του spring project
        ansible_host: azure-2
      # frontend-vm:
      #   ansible_host: frontserver
      frontend-vm: #VM για την εγκατάσταση του frontend
          ansible_host: azure-2
      backend-docker: #VM για την εγκαστάσταση της εφαρμογής μέσω της Ansible-Docker.
          ansible_host: devopspsvm
      Kubernetes: #VM για την εγκαστάσταση της εφαρμογής μέσω Kubernetes.
          ansible_host: k8s-vm
      gcloud-app-server:
        ansible_host: devops-gcloud
      

dbservers:
    hosts:
      dbserver-vm:
          ansible_host: dbserver
      azure-db-server: #VM για την εγκατάσταση της βάσης
          ansible_host: devopspsvm