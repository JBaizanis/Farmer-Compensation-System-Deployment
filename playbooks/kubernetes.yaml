---
- hosts: all
  become: yes
  
  # Κάνω clone το αντίστοιχο repository από το github.
  tasks:
    - name: Clone the Spring repository
      git:
        repo: "https://github.com/JBaizanis/devops-test.git"
        dest: "{{ appdir }}"
        version: "main"
        force: yes
    
    # Τρέχω τις εντολές microk8s.kubectl apply -f για τα αντίστοιχα services και deployments, ώστε να γίνει deploy η εφαρμογή μου. Στην συνέχεια την τρέχω γράφοντας στον browser το url jbaizanis.ddns.net.
    # Για να τρέξω το swagger κάνω από το terminal port forwarding.
    - name: Apply Kubernetes configurations
      shell: |
        microk8s.kubectl create secret docker-registry registry-credentials --from-file=.dockerconfigjson=.dockerconfig.json
        microk8s.kubectl apply -f "{{ appdir }}/k8s/postgres/"
        microk8s.kubectl apply -f "{{ appdir }}/k8s/spring/spring-svc.yaml"
        microk8s.kubectl apply -f "{{ appdir }}/k8s/spring/spring-deployment.yaml"
        microk8s.kubectl apply -f "{{ appdir }}/k8s/vue/vue-deployment.yaml"
        microk8s.kubectl apply -f "{{ appdir }}/k8s/vue/vue-svc.yaml"
        microk8s.kubectl apply -f "{{ appdir }}/k8s/vue/vue-ingress.yaml"
      args:
        chdir: "{{ appdir }}"
      register: kubectl_output
      ignore_errors: yes

    - name: Debug kubectl output
      ansible.builtin.debug:
        var: kubectl_output.stdout_lines
