- hosts: all
  become: yes
  tasks:
    - name: Check if Docker is installed
      shell: docker --version && docker compose version
      register: docker_version_result
      ignore_errors: true

    # - name: Include install_docker playbook if Docker is not installed
    #   include_tasks: docker.yaml
    #   when: not docker_installed

    # Για να εντοπίσω αν το docker και το docker compose είναι εγκατεστημένα κάνω έναν έλεγχο, βλέποντας την έκδοση τους. Αναθέτω το αποτέλεσμα του ελέγχου των 
    # εκδόσεων του docker και docker compose, στην μεταβλητή docker_version_result. Σε περίπτωση που το αποτέλεσμα στην μεταβλητή είναι οτιδήποτε εκτός του μηδενός, όπου 0 
    # σημαίνει επιτυχής εκτέλεση, τότε είτε το docker είτε το docker compose είτε και τα δύο δεν είναι εγκατεστημένα. Σε περίπτωση που δεν είναι εγκατεστημένα, 
    # εκτελείται το επόμενο task, όπου με την σειρά του εκτελεί το playbook docker.yaml για την εγκατάσταση τόσο του docker όσο και του docker compose στο vm. 
    # Το συγκεκριμένο task το έχω κάνει comment αφού είναι ήδη εγκατεστημένα τόσο το docker όσο και το docker compose, στο vm που κάνω deploy την εφαρμογή.
    
    # Κάνω clone το spring project από το αντίστοιχο git repo.
    - name: "Clone the Spring repository"
      git:
        repo: "https://github.com/JBaizanis/devops-test.git"
        dest: "spring"
        version: "{{ branch }}"
        force: yes

    # Κάνω update το αρχείο application.properties με τα items τα οποία βρίσκονται στο αρχείο backend-vm.yaml στον φάκελο host_vars. Αυτά τα items είναι το όνομα και ο κωδικός
    # του χρήστη της βάσης, dbuser και pass123 αλλά και το όνομα και το url στο οποίο τρέχει η βάση spring.datasource.url: jdbc:postgresql://4.211.248.159:5432/compensation.
    - name: "Populate application.properties"
      lineinfile:
        dest: "spring/src/main/resources/application.properties"
        state: present
        regexp: "^{{item.key}}="
        line: "{{item.key}}={{item.value}}"
      with_items:
        - "{{app.env | dict2items}}"
    
    # Επειδή μπορεί να τρέχουν διεργασίες και να απασχολούν το port 5432 στο οποίο "ακούει" η βάση, τις κάνω stop, ειδάλλως δεν μπορώ να τρέξω την εφαρμογή καθώς εμφανίζεται 
    # ομώνυμο σφάλμα. 
    - name: Stop processes using port 5432
      become: yes
      shell: "sudo lsof -i :5432 | awk 'NR>1 {print $2}' | xargs sudo kill"
      ignore_errors: true

    # Σε περίπτωση που ήδη τρέχουν containers από προηγούμενη εκτέλεση τα σταματώ και τα διαγράφω με την εντολή docker compose down.
    - name: Tear down existing services
      shell: docker compose down
      args:
        chdir: "spring"

    # Εφόσον έχω σταματήσει τα containers που ήδη έτρεχαν, κάνω docker-compose up --build ώστε να τρέξει το αρχείο docker-compose.yaml που βρίσκεται
    # στο κατάλογο spring (chdir: "spring") και να ξεκινήσουν τα services που ορίζονται σε αυτό, δηλαδή η βάση, το spring project και το frontend. 
    - name: Create and start services
      shell: docker-compose up --build
      args:
        chdir: "spring"
      register: output
      notify: Restart Docker Compose

    - debug:
        var: output

  handlers:
    - name: Restart Docker Compose
      shell: docker-compose restart
      args:
        chdir: "spring"